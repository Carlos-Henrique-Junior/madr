name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-asyncio pytest-cov httpx freezegun ruff
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest -q

  migracoes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: madr
          POSTGRES_PASSWORD: madr
          POSTGRES_DB: madr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://madr:madr@localhost:5432/madr
      SECRET_KEY: chave-de-teste-com-mais-de-32-bytes-aqui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Aplicar migrações e reverter
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
