{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block corpo %}
<section class="cartao estreito">
  <h1>Entrar no acervo</h1>
  <p class="sub">Use o e-mail e a senha da sua conta MADR.</p>

  {% if erro %}<div class="aviso ruim">{{ erro }}</div>{% endif %}

  <form method="post" action="/login" class="formulario">
    <label>
      E-mail
      <input type="email" name="email" required autofocus autocomplete="username">
    </label>
    <label>
      Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button class="botao" type="submit">Entrar</button>
  </form>

  <p class="nota">Ainda não tem conta? Crie em <code>POST /conta</code> na
    <a href="/docs">documentação da API</a>.</p>
</section>
{% endblock %}
