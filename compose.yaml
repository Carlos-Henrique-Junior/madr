services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-madr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madr}
      POSTGRES_DB: ${POSTGRES_DB:-madr}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-madr} -d ${POSTGRES_DB:-madr}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Só em loopback: o banco não fica exposto na rede do host.
      - '127.0.0.1:5432:5432'
    volumes:
      - madr-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    image: madr-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-madr}:${POSTGRES_PASSWORD:-madr}@db:5432/${POSTGRES_DB:-madr}
      # Sem SECRET_KEY no .env o compose recusa subir: nada de chave padrão em produção.
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  madr-data:
