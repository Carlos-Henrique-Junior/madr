[project]
name = "madr"
version = "0.1.0"
description = "MADR — Meu Acervo Digital de Romances (projeto final do FastAPI do Zero)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.16",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.8",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "aiosqlite>=0.21",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "httpx>=0.28",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["madr"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT", "FAST"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
"madr/web/*" = ["PLR0913", "PLR0917"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:warnings --cov=madr --cov-branch --cov-report=term-missing"
